name: "Security Scanning"
on:
  workflow_call:
    inputs:
      upload_report:
        description: "Whether to upload the SARIF security report to GitHub code scanning."
        type: boolean
        required: false
        default: true
jobs:
  ShiftLeft:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Perform ShiftLeft Scan
      uses: ShiftLeftSecurity/scan-action@4d4c04908eff87430482f36340ad5706c14cf9a6 # master
      env:
        WORKSPACE: ""
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCAN_AUTO_BUILD: true
      with:
        output: reports
    - name: Upload report
      if: inputs.upload_report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: reports

  Checkov:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Perform Checkov Scan
      uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # master
      with:
        output_format: cli,sarif
        output_file_path: console,results.sarif
        skip_check: CKV2_GHA_1

    - name: Upload Report
      uses: github/codeql-action/upload-sarif@v3
      if: inputs.upload_report && (success() || failure())
      with:
        sarif_file: results.sarif
 
